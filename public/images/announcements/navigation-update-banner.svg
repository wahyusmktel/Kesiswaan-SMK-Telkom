<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="45%" stop-color="#1e1b4b"/>
      <stop offset="85%" stop-color="#881337"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>

    <linearGradient id="redPill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>

    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>

    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.06"/>
    </linearGradient>

    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#fb7185" stop-opacity="0"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.45"/>
    </filter>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="35" result="blur" />
    </feGaussianBlur>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="560" fill="url(#bgGrad)"/>

  <!-- Tech Grid Background -->
  <g opacity="0.07" stroke="#ffffff" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="560"/>
    <line x1="200" y1="0" x2="200" y2="560"/>
    <line x1="300" y1="0" x2="300" y2="560"/>
    <line x1="400" y1="0" x2="400" y2="560"/>
    <line x1="500" y1="0" x2="500" y2="560"/>
    <line x1="600" y1="0" x2="600" y2="560"/>
    <line x1="700" y1="0" x2="700" y2="560"/>
    <line x1="800" y1="0" x2="800" y2="560"/>
    <line x1="900" y1="0" x2="900" y2="560"/>
    <line x1="1000" y1="0" x2="1000" y2="560"/>
    <line x1="1100" y1="0" x2="1100" y2="560"/>
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
  </g>

  <!-- Glow Orbs -->
  <circle cx="200" cy="120" r="140" fill="#e11d48" opacity="0.25" filter="url(#glow)"/>
  <circle cx="1020" cy="420" r="160" fill="#f43f5e" opacity="0.3" filter="url(#glow)"/>
  <circle cx="700" cy="180" r="120" fill="#6366f1" opacity="0.2" filter="url(#glow)"/>

  <!-- Left Content Column -->
  <g transform="translate(80, 85)">
    <!-- Pill Badge -->
    <g>
      <rect x="0" y="0" width="280" height="36" rx="18" fill="url(#redPill)" opacity="0.95"/>
      <circle cx="18" cy="18" r="6" fill="#ffffff"/>
      <text x="36" y="23" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" fill="#ffffff" letter-spacing="1.5">PEMBARUAN SISTEM SISFO</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="95" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
      Navigasi Lebih Rapi,
    </text>
    <text x="0" y="145" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="900" fill="#fda4af" letter-spacing="-0.5">
      Terstruktur &amp; Cepat
    </text>

    <!-- Subtitle -->
    <text x="0" y="195" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400" fill="#cbd5e1">
      Penyempurnaan menu sidebar dengan sistem grouping modul
    </text>
    <text x="0" y="220" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400" fill="#94a3b8">
      dan penambahan modul Rencana Anggaran Biaya (RAB) terbaru.
    </text>

    <!-- Highlights Features -->
    <g transform="translate(0, 260)">
      <!-- Item 1 -->
      <g transform="translate(0, 0)">
        <rect width="210" height="48" rx="12" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15"/>
        <text x="16" y="29" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff">📁 Grouping Modul</text>
      </g>
      <!-- Item 2 -->
      <g transform="translate(225, 0)">
        <rect width="210" height="48" rx="12" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15"/>
        <text x="16" y="29" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff">📊 Modul Anggaran RAB</text>
      </g>
    </g>
    <g transform="translate(0, 320)">
      <!-- Item 3 -->
      <g transform="translate(0, 0)">
        <rect width="210" height="48" rx="12" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15"/>
        <text x="16" y="29" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff">⚡ Accordion Dropdown</text>
      </g>
      <!-- Item 4 -->
      <g transform="translate(225, 0)">
        <rect width="210" height="48" rx="12" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15"/>
        <text x="16" y="29" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff">📱 Responsif &amp; Ringkas</text>
      </g>
    </g>
  </g>

  <!-- Right Side Mockup Visuals -->
  <g transform="translate(680, 60)">
    <!-- Main Backing Card (Sidebar Mockup) -->
    <g filter="url(#cardShadow)">
      <rect x="0" y="20" width="440" height="420" rx="24" fill="#0f172a" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.5"/>
      
      <!-- Mockup Header -->
      <path d="M 0 44 Q 0 20 24 20 L 416 20 Q 440 20 440 44 L 440 76 L 0 76 Z" fill="#1e293b"/>
      <circle cx="28" cy="48" r="6" fill="#ef4444"/>
      <circle cx="48" cy="48" r="6" fill="#f59e0b"/>
      <circle cx="68" cy="48" r="6" fill="#10b981"/>
      <text x="100" y="53" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#94a3b8">SMK TELKOM LAMPUNG • NAVIGASI</text>

      <!-- Sidebar Item 1: Active Main Group -->
      <g transform="translate(24, 96)">
        <rect width="392" height="48" rx="12" fill="url(#cardGrad2)" stroke="#e11d48" stroke-width="1.2"/>
        <rect x="14" y="14" width="20" height="20" rx="6" fill="#e11d48"/>
        <text x="46" y="29" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#ffffff">Akademik &amp; PKL</text>
        <path d="M 366 22 L 372 28 L 378 22" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
      </g>

      <!-- Submenu items inside Group 1 -->
      <g transform="translate(44, 154)">
        <line x1="8" y1="4" x2="8" y2="76" stroke="#475569" stroke-width="1.5"/>
        
        <circle cx="8" cy="16" r="3.5" fill="#f43f5e"/>
        <text x="26" y="20" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">Industri Kerjasama &amp; Rombel</text>

        <circle cx="8" cy="48" r="3.5" fill="#f43f5e"/>
        <text x="26" y="52" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">Monitoring Bimbingan PKL</text>

        <circle cx="8" cy="76" r="3.5" fill="#f43f5e"/>
        <text x="26" y="80" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">Repository Pembelajaran</text>
      </g>

      <!-- Sidebar Item 2: RAB Anggaran Highlight -->
      <g transform="translate(24, 256)">
        <rect width="392" height="52" rx="12" fill="url(#redPill)" opacity="0.95" filter="url(#cardShadow)"/>
        <rect x="14" y="14" width="24" height="24" rx="6" fill="#ffffff" fill-opacity="0.25"/>
        <text x="21" y="31" font-family="system-ui, sans-serif" font-size="14" fill="#ffffff">💰</text>
        <text x="48" y="31" font-family="system-ui, sans-serif" font-size="13" font-weight="900" fill="#ffffff">Rencana Anggaran Biaya (RAB)</text>
        <rect x="330" y="16" width="46" height="20" rx="10" fill="#ffffff"/>
        <text x="340" y="30" font-family="system-ui, sans-serif" font-size="10" font-weight="900" fill="#e11d48">BARU</text>
      </g>

      <!-- Sidebar Item 3: Sarpras -->
      <g transform="translate(24, 322)">
        <rect width="392" height="44" rx="12" fill="url(#cardGrad1)" stroke="#ffffff" stroke-opacity="0.08"/>
        <text x="46" y="27" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#cbd5e1">Sarana &amp; Prasarana</text>
        <path d="M 372 20 L 378 26 L 372 32" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round"/>
      </g>

      <!-- Sidebar Item 4: Master Data -->
      <g transform="translate(24, 376)">
        <rect width="392" height="44" rx="12" fill="url(#cardGrad1)" stroke="#ffffff" stroke-opacity="0.08"/>
        <text x="46" y="27" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#cbd5e1">Pusat Sistem &amp; Master Data</text>
        <path d="M 372 20 L 378 26 L 372 32" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round"/>
      </g>
    </g>
  </g>

  <!-- Bottom Brand Watermark -->
  <g transform="translate(80, 520)">
    <text x="0" y="0" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="1">
      SISFO SMK TELKOM LAMPUNG &bull; EXCELLENCE IN DIGITAL EDUCATION
    </text>
  </g>
</svg>
